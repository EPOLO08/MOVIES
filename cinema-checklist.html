<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cineteque</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c10;
  --bg2:#141418;
  --bg3:#1c1c22;
  --gold:#f5c518;
  --coral:#ff6b6b;
  --mint:#4ecdc4;
  --lavender:#c77dff;
  --white:#f0ece0;
  --gray:#999;
  --gray2:#444;
  --border:#252530;
  --card-radius:16px;
}
html,body{background:var(--bg);color:var(--white);font-family:'Space Grotesk',sans-serif;min-height:100vh;font-size:15px;overflow-x:hidden}

/* GRAIN OVERLAY */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:1000;opacity:0.4}

/* HEADER */
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:16px 24px 12px;position:sticky;top:0;z-index:100;box-shadow:0 4px 40px rgba(0,0,0,0.8)}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo-wrap{display:flex;flex-direction:column;gap:0}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;color:var(--white);letter-spacing:6px;line-height:1;display:flex;align-items:center;gap:10px}
.logo-dot{width:10px;height:10px;background:var(--coral);border-radius:50%;display:inline-block;margin-bottom:4px;box-shadow:0 0 14px var(--coral)}
.logo-sub{font-size:0.68rem;letter-spacing:5px;text-transform:uppercase;color:var(--gray);font-weight:300;margin-top:2px}
.tabs{display:flex;gap:6px}
.tab-btn{background:transparent;border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:0.75rem;padding:6px 16px;border-radius:30px;cursor:pointer;transition:all 0.2s;letter-spacing:2px;text-transform:uppercase;font-weight:500}
.tab-btn.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.progress-wrap{margin-top:12px}
.progress-info{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--gray);margin-bottom:5px;letter-spacing:0.5px}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));border-radius:2px;transition:width 0.5s cubic-bezier(.4,0,.2,1)}

/* FILTERS */
.filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search-box{flex:1;min-width:180px;background:var(--bg3);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:0.85rem;padding:9px 14px;border-radius:10px;outline:none;transition:border-color 0.2s}
.search-box:focus{border-color:var(--gold)}
.search-box::placeholder{color:var(--gray2)}
.filter-select{background:var(--bg3);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:0.8rem;padding:9px 10px;border-radius:10px;outline:none;cursor:pointer}
.filter-select option{background:var(--bg3)}
.filter-btns{display:flex;gap:5px;flex-wrap:wrap}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:0.72rem;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all 0.2s;letter-spacing:1px;text-transform:uppercase}
.filter-btn.active{background:var(--mint);color:#000;border-color:var(--mint);font-weight:700}

/* ACTIONS */
.actions{display:flex;gap:7px;flex-wrap:wrap;padding:10px 24px;background:var(--bg);border-bottom:1px solid var(--border)}
.action-btn{background:var(--bg3);border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:0.72rem;padding:6px 14px;border-radius:8px;cursor:pointer;transition:all 0.2s;letter-spacing:0.5px;font-weight:500}
.action-btn:hover{border-color:var(--gold);color:var(--gold)}
.action-btn-random{border-color:var(--coral);color:var(--coral);font-weight:700}
.action-btn-random:hover{background:var(--coral);color:#000}

/* MAIN GRID */
.main{padding:24px;max-width:1100px;margin:0 auto}
.count-info{font-size:0.75rem;color:var(--gray);padding:0 0 16px;letter-spacing:1px;text-transform:uppercase}

/* MOVIE GRID */
.movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}

/* MOVIE CARD */
.movie-card{background:var(--bg2);border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--border);transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;position:relative;cursor:pointer}
.movie-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,0.6);border-color:var(--gray2)}
.movie-card.watched{opacity:0.55}
.movie-card.watched:hover{opacity:0.85}

/* POSTER */
.poster-wrap{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--bg3)}
.poster-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.3s}
.movie-card:hover .poster-img{transform:scale(1.04)}
.poster-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
.poster-placeholder-year{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--border);letter-spacing:3px}
.poster-placeholder-title{font-family:'Playfair Display',serif;font-size:0.75rem;color:var(--gray2);line-height:1.3;font-style:italic}
.poster-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg3)}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}

/* WATCHED OVERLAY */
.watched-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;pointer-events:none}
.movie-card.watched .watched-overlay{opacity:1}
.watched-check{font-size:2rem;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.8))}

/* ACCENT BAR — color by genre */
.accent-bar{height:3px;width:100%}

/* CARD BODY */
.card-body{padding:12px}
.card-title{font-family:'Playfair Display',serif;font-size:0.88rem;font-weight:700;line-height:1.3;margin-bottom:4px;color:var(--white)}
.card-dir{font-size:0.72rem;color:var(--gray);margin-bottom:8px;font-weight:300}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:0.62rem;padding:2px 7px;border-radius:4px;letter-spacing:0.5px;font-weight:600;text-transform:uppercase}
.tag-year{background:rgba(245,197,24,0.15);color:var(--gold);border:1px solid rgba(245,197,24,0.2)}
.tag-country{background:rgba(78,205,196,0.12);color:var(--mint);border:1px solid rgba(78,205,196,0.2)}
.tag-stream{background:rgba(255,107,107,0.12);color:var(--coral);border:1px solid rgba(255,107,107,0.2)}

/* STARS in card */
.card-stars{display:flex;gap:2px;margin-bottom:8px}
.star{font-size:0.95rem;color:var(--gray2);cursor:pointer;transition:color 0.15s;min-width:20px;min-height:24px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.star.on{color:var(--gold)}

/* CHECKBOX in card */
.card-check-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.cb{width:20px;height:20px;border-radius:5px;border:2px solid var(--gray2);background:transparent;cursor:pointer;appearance:none;-webkit-appearance:none;position:relative;transition:all 0.2s;flex-shrink:0}
.cb:checked{background:var(--mint);border-color:var(--mint)}
.cb:checked::after{content:'';position:absolute;left:4px;top:1px;width:8px;height:11px;border:2px solid #000;border-top:none;border-left:none;transform:rotate(45deg)}
.card-check-label{font-size:0.72rem;color:var(--gray);cursor:pointer;user-select:none}

/* NOTE */
.card-note{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:0.75rem;padding:7px 9px;border-radius:8px;resize:none;min-height:38px;outline:none;transition:border-color 0.2s;line-height:1.4;margin-top:8px}
.card-note:focus{border-color:var(--gold)}
.card-note::placeholder{color:var(--gray2)}

/* CURIOUS FACT */
.curious-btn{width:100%;background:transparent;border:1px dashed var(--border);color:var(--lavender);font-family:'Space Grotesk',sans-serif;font-size:0.7rem;padding:6px 10px;border-radius:8px;cursor:pointer;transition:all 0.2s;margin-top:6px;letter-spacing:0.5px;text-align:left;display:flex;align-items:center;gap:6px}
.curious-btn:hover{border-color:var(--lavender);background:rgba(199,125,255,0.06)}
.curious-btn.loading-fact{color:var(--gray);cursor:wait}
.curious-fact{background:rgba(199,125,255,0.08);border:1px solid rgba(199,125,255,0.2);border-radius:8px;padding:10px;margin-top:6px;font-size:0.75rem;line-height:1.5;color:var(--white);position:relative}
.curious-fact-close{position:absolute;top:6px;right:8px;color:var(--gray);cursor:pointer;font-size:0.8rem;background:none;border:none;font-family:inherit;padding:0}
.curious-fact-label{font-size:0.62rem;color:var(--lavender);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;font-weight:600}

/* EMPTY STATE */
.empty{text-align:center;padding:80px 20px;color:var(--gray);grid-column:1/-1}
.empty-icon{font-size:3rem;margin-bottom:16px;display:block}

/* ALERT */
.alert{background:#1a0a0a;border:1px solid var(--coral);color:var(--coral);padding:12px 20px;margin:10px 24px;border-radius:10px;font-size:0.82rem;display:none}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:28px;max-width:500px;width:100%}
.modal h3{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;font-size:1.4rem;color:var(--gold);margin-bottom:6px}
.modal p{font-size:0.8rem;color:var(--gray);margin-bottom:14px}
.modal textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:0.8rem;padding:10px;border-radius:10px;min-height:120px;outline:none;resize:vertical}
.modal-btns{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.btn-primary{background:var(--gold);color:#000;border:none;font-family:'Space Grotesk',sans-serif;font-size:0.85rem;font-weight:700;padding:9px 22px;border-radius:10px;cursor:pointer}
.btn-secondary{background:transparent;color:var(--gray);border:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-size:0.85rem;padding:9px 22px;border-radius:10px;cursor:pointer}
.btn-secondary:hover{color:var(--white)}

/* RANDOM MODAL */
.random-movie-display{display:grid;grid-template-columns:120px 1fr;gap:16px;margin:16px 0;align-items:start}
.random-poster{width:120px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--bg3);flex-shrink:0}
.random-poster img{width:100%;height:100%;object-fit:cover}
.random-poster-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--border);letter-spacing:2px}
.random-info{}
.random-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--white);margin-bottom:4px;line-height:1.3;font-weight:700}
.random-dir{font-size:0.78rem;color:var(--gray);margin-bottom:10px}
.random-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.random-fact{background:rgba(199,125,255,0.08);border:1px solid rgba(199,125,255,0.2);border-radius:10px;padding:12px;margin-bottom:12px;font-size:0.78rem;line-height:1.5;color:var(--white)}
.random-fact-label{font-size:0.62rem;color:var(--lavender);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;font-weight:600}
.random-fact-loading{color:var(--gray);font-style:italic;font-size:0.78rem}
.random-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-reroll{background:var(--bg3);color:var(--white);border:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-size:0.82rem;padding:9px 18px;border-radius:10px;cursor:pointer;font-weight:500}
.btn-reroll:hover{border-color:var(--coral);color:var(--coral)}
.random-check-row{display:flex;align-items:center;gap:8px}
.random-remaining{font-size:0.68rem;color:var(--gray2);margin-top:10px;text-align:right;letter-spacing:0.5px}
.no-random{color:var(--gray);text-align:center;padding:30px 0;font-size:0.9rem;line-height:1.8}

/* GENRE COLOR ACCENTS */
.accent-drama{background:linear-gradient(90deg,#c77dff,#9d4edd)}
.accent-terror{background:linear-gradient(90deg,#ff6b6b,#ee3333)}
.accent-doc{background:linear-gradient(90deg,#4ecdc4,#2ab5ac)}
.accent-comedia{background:linear-gradient(90deg,#f5c518,#e6a817)}
.accent-sci{background:linear-gradient(90deg,#74c0fc,#4dabf7)}
.accent-accion{background:linear-gradient(90deg,#ff922b,#f76707)}
.accent-romance{background:linear-gradient(90deg,#f783ac,#e64980)}
.accent-mudo{background:linear-gradient(90deg,#868e96,#495057)}
.accent-anime{background:linear-gradient(90deg,#63e6be,#20c997)}
.accent-default{background:linear-gradient(90deg,#444,#333)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.movie-card{animation:fadeIn 0.3s ease both}

@media(max-width:600px){
  .movie-grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
  .main{padding:16px}
  .header{padding:12px 16px 10px}
  .filters,.actions{padding:10px 16px}
  .logo{font-size:1.9rem}
  .random-movie-display{grid-template-columns:90px 1fr;gap:12px}
  .random-poster{width:90px}
}
</style>
</head>
<body>

<div id="ls-alert" class="alert">⚠ localStorage no disponible. Tu progreso NO se guardará.</div>

<div class="header">
  <div class="header-top">
    <div class="logo-wrap">
      <div class="logo"><span class="logo-dot"></span>CINETEQUE</div>
      <div class="logo-sub">tu checklist de cine mundial</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(100)">Top 100</button>
      <button class="tab-btn" onclick="switchTab(500)">Lista 500</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-label">Cargando...</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>

<div class="filters">
  <input class="search-box" type="text" id="search-input" placeholder="Buscar título, director..." oninput="applyFilters()">
  <select class="filter-select" id="filter-country" onchange="applyFilters()"><option value="">Todos los países</option></select>
  <select class="filter-select" id="filter-decade" onchange="applyFilters()"><option value="">Todas las décadas</option></select>
  <select class="filter-select" id="filter-genre" onchange="applyFilters()"><option value="">Todos los géneros</option></select>
  <div class="filter-btns">
    <button class="filter-btn active" id="btn-all" onclick="setStatusFilter('all')">Todas</button>
    <button class="filter-btn" id="btn-seen" onclick="setStatusFilter('seen')">Vistas</button>
    <button class="filter-btn" id="btn-unseen" onclick="setStatusFilter('unseen')">Por ver</button>
  </div>
</div>

<div class="actions">
  <button class="action-btn action-btn-random" onclick="pickRandom()">🎲 Random</button>
  <button class="action-btn" onclick="exportProgress()">↓ Exportar</button>
  <button class="action-btn" onclick="openImportModal()">↑ Importar</button>
  <button class="action-btn" onclick="clearAllProgress()">✕ Resetear</button>
</div>

<div class="main">
  <div class="count-info" id="count-info"></div>
  <div class="movie-grid" id="movie-list"></div>
</div>

<div class="modal-overlay" id="random-modal">
  <div class="modal" style="max-width:560px">
    <h3>Película Random</h3>
    <p id="random-subtitle">Solo películas no vistas · respeta filtros activos</p>
    <div id="random-result"></div>
    <div class="modal-btns"><button class="btn-secondary" onclick="closeRandomModal()">Cerrar</button></div>
  </div>
</div>

<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <h3>Importar Progreso</h3>
    <p>Pega el JSON exportado previamente:</p>
    <textarea id="import-text" placeholder='{"watched":{},"ratings":{},"notes":{}}'></textarea>
    <div class="modal-btns">
      <button class="btn-secondary" onclick="closeImportModal()">Cancelar</button>
      <button class="btn-primary" onclick="doImport()">Importar</button>
    </div>
  </div>
</div>

/* ============================================================
   TMDB POSTER FETCH
   Uses TMDB public search — no API key needed for basic search
   Falls back to placeholder gracefully
   ============================================================ */

var TMDB_KEY = '2dca580c2a14b55200e784d157207b4d'; /* public demo key */

function fetchPoster(movieId, title, year, imgEl, placeholderEl) {
  if (posterCache[movieId]) {
    if (posterCache[movieId] === 'none') {
      showPlaceholder(placeholderEl, title, year);
    } else {
      imgEl.src = posterCache[movieId];
      imgEl.style.display = 'block';
      if (placeholderEl) { placeholderEl.style.display = 'none'; }
    }
    /* hide spinner */
    var spinner = imgEl.parentNode.querySelector('.poster-loading');
    if (spinner) { spinner.style.display = 'none'; }
    return;
  }

  var query = encodeURIComponent(title);
  var url = 'https://api.themoviedb.org/3/search/movie?api_key=' + TMDB_KEY + '&query=' + query + '&year=' + year + '&language=en-US';

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var spinner = imgEl.parentNode ? imgEl.parentNode.querySelector('.poster-loading') : null;
    if (spinner) { spinner.style.display = 'none'; }

    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        if (data.results && data.results.length > 0 && data.results[0].poster_path) {
          var posterUrl = 'https://image.tmdb.org/t/p/w300' + data.results[0].poster_path;
          posterCache[movieId] = posterUrl;
          /* Check if element is still in DOM */
          var currentImg = document.getElementById('poster-img-' + movieId);
          if (currentImg) {
            currentImg.src = posterUrl;
            currentImg.style.display = 'block';
            var ph = document.getElementById('poster-ph-' + movieId);
            if (ph) { ph.style.display = 'none'; }
          }
        } else {
          posterCache[movieId] = 'none';
          var ph2 = document.getElementById('poster-ph-' + movieId);
          if (ph2) { showPlaceholder(ph2, title, year); }
        }
      } catch(e) {
        posterCache[movieId] = 'none';
        var ph3 = document.getElementById('poster-ph-' + movieId);
        if (ph3) { showPlaceholder(ph3, title, year); }
      }
    } else {
      posterCache[movieId] = 'none';
      var ph4 = document.getElementById('poster-ph-' + movieId);
      if (ph4) { showPlaceholder(ph4, title, year); }
    }
  };
  xhr.send();
}

function showPlaceholder(el, title, year) {
  if (!el) { return; }
  el.style.display = 'flex';
  el.innerHTML = '<div class="poster-placeholder-year">' + year + '</div>'
    + '<div class="poster-placeholder-title">' + escapeHtml(title) + '</div>';
}

/* ============================================================
   GENRE → ACCENT COLOR
   ============================================================ */

function getAccentClass(genre) {
  var g = genre.toLowerCase();
  if (g.indexOf('terror') !== -1 || g.indexOf('horror') !== -1) { return 'accent-terror'; }
  if (g.indexOf('mudo') !== -1 || g.indexOf('silente') !== -1) { return 'accent-mudo'; }
  if (g.indexOf('documental') !== -1) { return 'accent-doc'; }
  if (g.indexOf('comedia') !== -1) { return 'accent-comedia'; }
  if (g.indexOf('ciencia ficción') !== -1 || g.indexOf('sci') !== -1) { return 'accent-sci'; }
  if (g.indexOf('acción') !== -1 || g.indexOf('accion') !== -1) { return 'accent-accion'; }
  if (g.indexOf('romance') !== -1 || g.indexOf('romántic') !== -1) { return 'accent-romance'; }
  if (g.indexOf('animación') !== -1 || g.indexOf('anime') !== -1) { return 'accent-anime'; }
  if (g.indexOf('drama') !== -1) { return 'accent-drama'; }
  return 'accent-default';
}

/* ============================================================
   CURIOUS FACTS via Claude API
   ============================================================ */

function loadCuriousFact(movieId, title, year, dir, targetDivId) {
  var btn = document.getElementById('curious-btn-' + movieId);
  var factDiv = document.getElementById('curious-div-' + movieId);

  if (!btn || !factDiv) { return; }

  /* Already loaded */
  if (factDiv.dataset && factDiv.dataset.loaded === 'true') {
    factDiv.style.display = factDiv.style.display === 'none' ? 'block' : 'none';
    return;
  }

  btn.className = 'curious-btn loading-fact';
  btn.innerHTML = '⏳ Buscando dato curioso...';

  var prompt = 'Dame UN solo dato curioso, desconocido o sorprendente sobre la película "' + title + '" (' + year + ') dirigida por ' + dir + '. Máximo 2 oraciones. Solo el dato, sin introducción, sin comillas al inicio.';

  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.anthropic.com/v1/messages', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var factDivNow = document.getElementById('curious-div-' + movieId);
    var btnNow = document.getElementById('curious-btn-' + movieId);
    if (!factDivNow) { return; }

    if (xhr.status === 200) {
      try {
        var resp = JSON.parse(xhr.responseText);
        var text = '';
        if (resp.content && resp.content.length > 0) {
          for (var i = 0; i < resp.content.length; i++) {
            if (resp.content[i].type === 'text') { text = resp.content[i].text; break; }
          }
        }
        if (text) {
          factDivNow.innerHTML = '<div class="curious-fact-label">✦ dato curioso</div>' + escapeHtml(text);
          factDivNow.style.display = 'block';
          factDivNow.dataset = factDivNow.dataset || {};
          factDivNow.dataset.loaded = 'true';
          if (btnNow) { btnNow.style.display = 'none'; }
        } else {
          throw new Error('empty');
        }
      } catch(e) {
        factDivNow.innerHTML = '<div class="curious-fact-label">✦ dato curioso</div>No se pudo cargar el dato. Intenta de nuevo.';
        factDivNow.style.display = 'block';
        if (btnNow) {
          btnNow.className = 'curious-btn';
          btnNow.innerHTML = '✦ Dato curioso';
        }
      }
    } else {
      if (btnNow) {
        btnNow.className = 'curious-btn';
        btnNow.innerHTML = '✦ Dato curioso';
      }
    }
  };

  var body = JSON.stringify({
    model: 'claude-sonnet-4-20250514',
    max_tokens: 1000,
    messages: [{role: 'user', content: prompt}]
  });
  xhr.send(body);
}

/* ============================================================
   STORAGE
   ============================================================ */

function saveAll() {
  if (!lsAvailable) { return; }
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({watched: watched, ratings: ratings, notes: notes}));
  } catch(e) { console.error('Save error:', e); }
}

function loadAll() {
  if (!lsAvailable) { return; }
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) { return; }
    var data = JSON.parse(raw);
    if (data.watched) { watched = data.watched; }
    if (data.ratings) { ratings = data.ratings; }
    if (data.notes) { notes = data.notes; }
  } catch(e) { console.error('Load error:', e); }
}

/* ============================================================
   PROGRESS
   ============================================================ */

function updateProgress() {
  var allMovies = top100.concat(list500);
  var total = allMovies.length;
  var seen = 0;
  var i;
  for (i = 0; i < allMovies.length; i++) {
    if (watched[allMovies[i].id] === true) { seen++; }
  }
  var currentList = getCurrentList();
  var tabSeen = 0;
  for (i = 0; i < currentList.length; i++) {
    if (watched[currentList[i].id] === true) { tabSeen++; }
  }
  var pct = total > 0 ? Math.round((seen / total) * 100) : 0;
  document.getElementById('prog-label').textContent = tabSeen + ' / ' + currentList.length + ' en esta lista · ' + seen + ' / ' + total + ' total';
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

/* ============================================================
   ACTIONS
   ============================================================ */

function toggleWatched(id) {
  watched[id] = !watched[id];
  saveAll();
  updateProgress();
  var card = document.getElementById('card-' + id);
  if (card) {
    if (watched[id]) { card.classList.add('watched'); } else { card.classList.remove('watched'); }
  }
}

function setRating(id, val) {
  ratings[id] = val;
  saveAll();
  var starsDiv = document.getElementById('stars-' + id);
  if (starsDiv) { starsDiv.innerHTML = buildStarsHTML(id); }
}

function buildStarsHTML(id) {
  var r = ratings[id] || 0;
  var html = '';
  for (var i = 1; i <= 5; i++) {
    var cls = i <= r ? 'star on' : 'star';
    html += '<span class="' + cls + '" onclick="setRating(\'' + id + '\',' + i + ')">★</span>';
  }
  return html;
}

function saveNote(id, val) {
  notes[id] = val;
  saveAll();
}

/* ============================================================
   FILTERS
   ============================================================ */

function getCurrentList() {
  return currentTab === 100 ? top100 : list500;
}

function getFilterValues() {
  return {
    text: document.getElementById('search-input').value.toLowerCase(),
    country: document.getElementById('filter-country').value,
    decade: document.getElementById('filter-decade').value,
    genre: document.getElementById('filter-genre').value,
    status: statusFilter
  };
}

function getDecade(year) {
  return Math.floor(year / 10) * 10;
}

function matchesFilters(m, f) {
  if (f.text) {
    var s = (m.title + ' ' + m.dir + ' ' + m.country + ' ' + m.genre).toLowerCase();
    if (s.indexOf(f.text) === -1) { return false; }
  }
  if (f.country && m.country.indexOf(f.country) === -1) { return false; }
  if (f.decade && getDecade(m.year) !== parseInt(f.decade)) { return false; }
  if (f.genre && m.genre.indexOf(f.genre) === -1) { return false; }
  if (f.status === 'seen' && watched[m.id] !== true) { return false; }
  if (f.status === 'unseen' && watched[m.id] === true) { return false; }
  return true;
}

function applyFilters() {
  var f = getFilterValues();
  var list = getCurrentList();
  var filtered = [];
  for (var i = 0; i < list.length; i++) {
    if (matchesFilters(list[i], f)) { filtered.push(list[i]); }
  }
  renderList(filtered);
  document.getElementById('count-info').textContent = filtered.length + ' de ' + list.length + ' películas';
}

function setStatusFilter(val) {
  statusFilter = val;
  var map = {all: 'btn-all', seen: 'btn-seen', unseen: 'btn-unseen'};
  var keys = ['all', 'seen', 'unseen'];
  for (var i = 0; i < keys.length; i++) {
    var btn = document.getElementById(map[keys[i]]);
    if (btn) {
      if (keys[i] === val) { btn.classList.add('active'); } else { btn.classList.remove('active'); }
    }
  }
  applyFilters();
}

function buildFilterOptions() {
  var list = getCurrentList();
  var countries = {}, decades = {}, genres = {};
  var i, j, parts, p;
  for (i = 0; i < list.length; i++) {
    var m = list[i];
    parts = m.country.split(' / ');
    for (j = 0; j < parts.length; j++) { p = parts[j].trim(); if (p) { countries[p] = true; } }
    decades[getDecade(m.year)] = true;
    parts = m.genre.split(' / ');
    for (j = 0; j < parts.length; j++) { p = parts[j].trim(); if (p) { genres[p] = true; } }
  }
  var ch = '<option value="">Todos los países</option>';
  var ca = Object.keys(countries).sort();
  for (i = 0; i < ca.length; i++) { ch += '<option value="' + ca[i] + '">' + ca[i] + '</option>'; }
  document.getElementById('filter-country').innerHTML = ch;

  var dh = '<option value="">Todas las décadas</option>';
  var da = Object.keys(decades).sort();
  for (i = 0; i < da.length; i++) { dh += '<option value="' + da[i] + '">' + da[i] + 's</option>'; }
  document.getElementById('filter-decade').innerHTML = dh;

  var gh = '<option value="">Todos los géneros</option>';
  var ga = Object.keys(genres).sort();
  for (i = 0; i < ga.length; i++) { gh += '<option value="' + ga[i] + '">' + ga[i] + '</option>'; }
  document.getElementById('filter-genre').innerHTML = gh;
}

/* ============================================================
   RENDER
   ============================================================ */

/* Intersection Observer for lazy poster loading */
var posterObserver = null;

function setupObserver() {
  if (!window.IntersectionObserver) { return; }
  if (posterObserver) { posterObserver.disconnect(); }
  posterObserver = new IntersectionObserver(function(entries) {
    for (var i = 0; i < entries.length; i++) {
      var entry = entries[i];
      if (entry.isIntersecting) {
        var el = entry.target;
        var mid = el.getAttribute('data-movie-id');
        var title = el.getAttribute('data-title');
        var year = el.getAttribute('data-year');
        var imgEl = document.getElementById('poster-img-' + mid);
        var phEl = document.getElementById('poster-ph-' + mid);
        if (imgEl && !imgEl.src) {
          fetchPoster(mid, title, year, imgEl, phEl);
        }
        posterObserver.unobserve(el);
      }
    }
  }, {rootMargin: '200px'});
}

function renderList(movies) {
  setupObserver();
  var container = document.getElementById('movie-list');
  var html = '';
  var i, m, isWatched, note, accentClass, cbChecked, cardClass;

  for (i = 0; i < movies.length; i++) {
    m = movies[i];
    isWatched = watched[m.id] === true;
    note = notes[m.id] || '';
    accentClass = getAccentClass(m.genre);
    cbChecked = isWatched ? 'checked' : '';
    cardClass = isWatched ? 'movie-card watched' : 'movie-card';

    html += '<div class="' + cardClass + '" id="card-' + m.id + '">';

    /* POSTER */
    html += '<div class="poster-wrap" data-movie-id="' + m.id + '" data-title="' + escapeAttr(m.title) + '" data-year="' + m.year + '">';
    html += '<div class="poster-loading" id="poster-load-' + m.id + '"><div class="spinner"></div></div>';
    html += '<img id="poster-img-' + m.id + '" style="display:none" alt="' + escapeAttr(m.title) + '" onerror="handleImgError(\'' + m.id + '\',\'' + escapeAttr(m.title) + '\',' + m.year + ')">';
    html += '<div id="poster-ph-' + m.id + '" class="poster-placeholder" style="display:none"></div>';
    html += '<div class="watched-overlay"><span class="watched-check">✓</span></div>';
    html += '</div>';

    /* ACCENT BAR */
    html += '<div class="accent-bar ' + accentClass + '"></div>';

    /* CARD BODY */
    html += '<div class="card-body">';
    html += '<div class="card-title">' + escapeHtml(m.title) + '</div>';
    html += '<div class="card-dir">' + escapeHtml(m.dir) + '</div>';
    html += '<div class="card-tags">';
    html += '<span class="tag tag-year">' + m.year + '</span>';
    html += '<span class="tag tag-country">' + escapeHtml(m.country) + '</span>';
    if (m.stream) { html += '<span class="tag tag-stream">' + escapeHtml(m.stream) + '</span>'; }
    html += '</div>';
    html += '<div class="card-stars" id="stars-' + m.id + '">' + buildStarsHTML(m.id) + '</div>';
    html += '<div class="card-check-row">';
    html += '<input type="checkbox" class="cb" id="cb-' + m.id + '" ' + cbChecked + ' onchange="toggleWatched(\'' + m.id + '\')">';
    html += '<label class="card-check-label" for="cb-' + m.id + '">Vista</label>';
    html += '</div>';
    html += '<textarea class="card-note" placeholder="Notas..." onchange="saveNote(\'' + m.id + '\',this.value)">' + escapeHtml(note) + '</textarea>';

    /* CURIOUS FACT BUTTON */
    html += '<button class="curious-btn" id="curious-btn-' + m.id + '" onclick="loadCuriousFact(\'' + m.id + '\',\'' + escapeAttr(m.title) + '\',' + m.year + ',\'' + escapeAttr(m.dir) + '\',\'' + m.id + '\')">';
    html += '✦ Dato curioso</button>';
    html += '<div class="curious-fact" id="curious-div-' + m.id + '" style="display:none"></div>';

    html += '</div>'; /* card-body */
    html += '</div>'; /* movie-card */
  }

  if (movies.length === 0) {
    html = '<div class="empty"><span class="empty-icon">🎬</span><p>No hay películas con estos filtros.</p></div>';
  }

  container.innerHTML = html;

  /* Attach observer to poster-wrap elements */
  if (posterObserver) {
    var wraps = container.querySelectorAll('.poster-wrap[data-movie-id]');
    for (var j = 0; j < wraps.length; j++) {
      posterObserver.observe(wraps[j]);
    }
  } else {
    /* Fallback: load all immediately */
    var allWraps = container.querySelectorAll('.poster-wrap[data-movie-id]');
    for (var k = 0; k < allWraps.length; k++) {
      var w = allWraps[k];
      var mid2 = w.getAttribute('data-movie-id');
      var t2 = w.getAttribute('data-title');
      var y2 = w.getAttribute('data-year');
      fetchPoster(mid2, t2, y2, document.getElementById('poster-img-' + mid2), document.getElementById('poster-ph-' + mid2));
    }
  }
}

function handleImgError(movieId, title, year) {
  posterCache[movieId] = 'none';
  var img = document.getElementById('poster-img-' + movieId);
  if (img) { img.style.display = 'none'; }
  var ph = document.getElementById('poster-ph-' + movieId);
  if (ph) { showPlaceholder(ph, title, year); }
}

function escapeHtml(str) {
  if (!str) { return ''; }
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeAttr(str) {
  if (!str) { return ''; }
  return str.replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}

/* ============================================================
   SWITCH TAB
   ============================================================ */

function switchTab(tabNum) {
  currentTab = tabNum;
  document.getElementById('search-input').value = '';
  document.getElementById('filter-country').value = '';
  document.getElementById('filter-decade').value = '';
  document.getElementById('filter-genre').value = '';
  statusFilter = 'all';
  setStatusFilter('all');
  var tabBtns = document.querySelectorAll('.tab-btn');
  for (var i = 0; i < tabBtns.length; i++) { tabBtns[i].classList.remove('active'); }
  tabBtns[tabNum === 100 ? 0 : 1].classList.add('active');
  buildFilterOptions();
  applyFilters();
  updateProgress();
}

/* ============================================================
   RANDOM
   ============================================================ */

function getFilteredUnwatched() {
  var f = getFilterValues();
  var list = getCurrentList();
  var pool = [];
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    if (watched[m.id] === true) { continue; }
    if (f.text) {
      var s = (m.title + ' ' + m.dir + ' ' + m.country + ' ' + m.genre).toLowerCase();
      if (s.indexOf(f.text) === -1) { continue; }
    }
    if (f.country && m.country.indexOf(f.country) === -1) { continue; }
    if (f.decade && getDecade(m.year) !== parseInt(f.decade)) { continue; }
    if (f.genre && m.genre.indexOf(f.genre) === -1) { continue; }
    pool.push(m);
  }
  return pool;
}

function pickRandom() {
  var pool = getFilteredUnwatched();
  var resultDiv = document.getElementById('random-result');
  document.getElementById('random-modal').classList.add('open');

  if (pool.length === 0) {
    resultDiv.innerHTML = '<div class="no-random">🎉 Ya viste todo con estos filtros.<br><small style="color:var(--gray2)">Prueba quitando algún filtro.</small></div>';
    return;
  }

  if (lastRandomPool.length === 0 || lastRandomPool.length !== pool.length) {
    lastRandomPool = pool.slice();
  }

  var idx = Math.floor(Math.random() * lastRandomPool.length);
  var m = lastRandomPool[idx];
  lastRandomPool.splice(idx, 1);

  var accentClass = getAccentClass(m.genre);
  var cbChecked = watched[m.id] ? 'checked' : '';
  var starsHtml = buildStarsHTML(m.id);

  resultDiv.innerHTML = '<div style="margin:16px 0">'
    + '<div class="accent-bar ' + accentClass + '" style="border-radius:4px;margin-bottom:16px"></div>'
    + '<div class="random-movie-display">'
    + '<div class="random-poster">'
    + '<div class="poster-loading" id="r-spin-' + m.id + '"><div class="spinner"></div></div>'
    + '<img id="r-img-' + m.id + '" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:10px" alt="' + escapeAttr(m.title) + '">'
    + '<div id="r-ph-' + m.id + '" class="random-poster-placeholder" style="display:none">' + m.year + '</div>'
    + '</div>'
    + '<div class="random-info">'
    + '<div class="random-title">' + escapeHtml(m.title) + '</div>'
    + '<div class="random-dir">' + escapeHtml(m.dir) + ' · ' + m.year + '</div>'
    + '<div class="random-tags">'
    + '<span class="tag tag-country">' + escapeHtml(m.country) + '</span>'
    + '<span class="tag tag-stream">' + escapeHtml(m.stream) + '</span>'
    + '</div>'
    + '<div id="random-stars-' + m.id + '" style="display:flex;gap:3px;margin-bottom:10px">' + starsHtml + '</div>'
    + '<div class="random-check-row">'
    + '<input type="checkbox" class="cb" id="r-cb-' + m.id + '" ' + cbChecked + ' onchange="toggleWatchedRandom(\'' + m.id + '\')">'
    + '<label for="r-cb-' + m.id + '" style="font-size:0.78rem;color:var(--gray);cursor:pointer">Marcar como vista</label>'
    + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="random-fact" id="r-fact-' + m.id + '">'
    + '<div class="random-fact-label">✦ dato curioso</div>'
    + '<div class="random-fact-loading" id="r-fact-text-' + m.id + '">Cargando dato curioso...</div>'
    + '</div>'
    + '<div class="random-btns">'
    + '<button class="btn-reroll" onclick="pickRandom()">🎲 Otra película</button>'
    + '</div>'
    + '<div class="random-remaining">' + lastRandomPool.length + ' películas más sin ver con estos filtros</div>'
    + '</div>';

  /* Load poster for random */
  var rImg = document.getElementById('r-img-' + m.id);
  var rPh = document.getElementById('r-ph-' + m.id);
  var rSpin = document.getElementById('r-spin-' + m.id);
  if (rImg) {
    fetchPosterForRandom(m.id, m.title, m.year, rImg, rPh, rSpin);
  }

  /* Load curious fact automatically in random */
  fetchRandomFact(m.id, m.title, m.year, m.dir);
}

function fetchPosterForRandom(movieId, title, year, imgEl, phEl, spinEl) {
  if (posterCache[movieId] && posterCache[movieId] !== 'none') {
    if (spinEl) { spinEl.style.display = 'none'; }
    imgEl.src = posterCache[movieId];
    imgEl.style.display = 'block';
    if (phEl) { phEl.style.display = 'none'; }
    return;
  }
  if (posterCache[movieId] === 'none') {
    if (spinEl) { spinEl.style.display = 'none'; }
    if (phEl) { phEl.style.display = 'block'; }
    return;
  }
  var query = encodeURIComponent(title);
  var url = 'https://api.themoviedb.org/3/search/movie?api_key=' + TMDB_KEY + '&query=' + query + '&year=' + year + '&language=en-US';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    if (spinEl) { spinEl.style.display = 'none'; }
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        if (data.results && data.results.length > 0 && data.results[0].poster_path) {
          var posterUrl = 'https://image.tmdb.org/t/p/w300' + data.results[0].poster_path;
          posterCache[movieId] = posterUrl;
          imgEl.src = posterUrl;
          imgEl.style.display = 'block';
          if (phEl) { phEl.style.display = 'none'; }
        } else {
          posterCache[movieId] = 'none';
          if (phEl) { phEl.style.display = 'block'; }
        }
      } catch(e) {
        if (phEl) { phEl.style.display = 'block'; }
      }
    } else {
      if (phEl) { phEl.style.display = 'block'; }
    }
  };
  xhr.send();
}

function fetchRandomFact(movieId, title, year, dir) {
  var factTextEl = document.getElementById('r-fact-text-' + movieId);
  if (!factTextEl) { return; }

  var prompt = 'Dame UN solo dato curioso, inesperado o poco conocido sobre la película "' + title + '" (' + year + ') de ' + dir + '. Máximo 2 oraciones directas. Sin introducción.';

  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.anthropic.com/v1/messages', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var el = document.getElementById('r-fact-text-' + movieId);
    if (!el) { return; }
    if (xhr.status === 200) {
      try {
        var resp = JSON.parse(xhr.responseText);
        var text = '';
        if (resp.content && resp.content.length > 0) {
          for (var i = 0; i < resp.content.length; i++) {
            if (resp.content[i].type === 'text') { text = resp.content[i].text; break; }
          }
        }
        el.textContent = text || 'Sin dato disponible.';
        el.className = '';
      } catch(e) {
        el.textContent = 'Sin dato disponible.';
        el.className = '';
      }
    } else {
      el.textContent = 'No se pudo cargar el dato.';
      el.className = '';
    }
  };
  var body = JSON.stringify({
    model: 'claude-sonnet-4-20250514',
    max_tokens: 1000,
    messages: [{role: 'user', content: prompt}]
  });
  xhr.send(body);
}

function toggleWatchedRandom(id) {
  toggleWatched(id);
  var rStars = document.getElementById('random-stars-' + id);
  if (rStars) { rStars.innerHTML = buildStarsHTML(id); }
}

function closeRandomModal() {
  document.getElementById('random-modal').classList.remove('open');
  lastRandomPool = [];
}

/* ============================================================
   EXPORT / IMPORT / RESET
   ============================================================ */

function exportProgress() {
  var data = JSON.stringify({watched: watched, ratings: ratings, notes: notes}, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'cineteque-progreso.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function openImportModal() { document.getElementById('import-modal').classList.add('open'); }
function closeImportModal() { document.getElementById('import-modal').classList.remove('open'); document.getElementById('import-text').value = ''; }

function doImport() {
  var txt = document.getElementById('import-text').value.trim();
  if (!txt) { alert('Pega el JSON primero.'); return; }
  try {
    var data = JSON.parse(txt);
    if (data.watched) { watched = data.watched; }
    if (data.ratings) { ratings = data.ratings; }
    if (data.notes) { notes = data.notes; }
    saveAll();
    closeImportModal();
    applyFilters();
    updateProgress();
    alert('¡Progreso importado!');
  } catch(e) { alert('JSON inválido.'); }
}

function clearAllProgress() {
  if (!confirm('¿Borrar todo el progreso?')) { return; }
  watched = {}; ratings = {}; notes = {};
  saveAll();
  applyFilters();
  updateProgress();
}

/* ============================================================
   INIT
   ============================================================ */

loadAll();
buildFilterOptions();
applyFilters();
updateProgress();

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeImportModal(); closeRandomModal(); }
});
document.getElementById('import-modal').addEventListener('click', function(e) {
  if (e.target === this) { closeImportModal(); }
});
document.getElementById('random-modal').addEventListener('click', function(e) {
  if (e.target === this) { closeRandomModal(); }
});

</script>
