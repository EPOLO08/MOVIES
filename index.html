<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cineteque</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Space+Grotesk:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c10;--bg2:#121218;--bg3:#1a1a24;
  --gold:#f5c518;--coral:#ff6b6b;--mint:#4ecdc4;--lav:#c77dff;
  --white:#f0ece0;--gray:#888;--gray2:#3a3a4a;--border:#222230;
}
html,body{background:var(--bg);color:var(--white);font-family:'Space Grotesk',sans-serif;min-height:100vh;font-size:15px;overflow-x:hidden}

/* HEADER */
.hdr{background:var(--bg);border-bottom:1px solid var(--border);padding:14px 20px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 24px rgba(0,0,0,.7)}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:5px;display:flex;align-items:center;gap:8px}
.logo-dot{width:9px;height:9px;background:var(--coral);border-radius:50%;flex-shrink:0;box-shadow:0 0 10px var(--coral)}
.logo-sub{font-size:.62rem;letter-spacing:4px;text-transform:uppercase;color:var(--gray);font-weight:300;margin-top:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:.72rem;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.tab.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.tab.discover-tab.on{background:var(--lav);border-color:var(--lav)}

/* PROGRESS */
.prog{margin-top:10px}
.prog-row{display:flex;justify-content:space-between;font-size:.7rem;color:var(--gray);margin-bottom:4px}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--gold));transition:width .4s}

/* SAVE INDICATOR */
.save-ind{font-size:.68rem;color:var(--mint);letter-spacing:1px;opacity:0;transition:opacity .3s;margin-left:6px;align-self:center}

/* FILTERS */
.filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px}
.search{flex:1;min-width:160px;background:var(--bg3);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:.83rem;padding:8px 12px;border-radius:8px;outline:none;transition:border-color .2s}
.search:focus{border-color:var(--gold)}
.search::placeholder{color:#444}
.fsel{background:var(--bg3);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:.78rem;padding:8px 10px;border-radius:8px;outline:none;cursor:pointer;max-width:140px}
.fsel option{background:var(--bg3)}
.fbtn{background:transparent;border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:.68rem;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .2s;letter-spacing:.5px;text-transform:uppercase}
.fbtn.on{background:var(--mint);color:#000;border-color:var(--mint);font-weight:700}

/* ACTIONS */
.actions{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px;background:var(--bg);border-bottom:1px solid var(--border);align-items:center}
.abtn{background:var(--bg3);border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:.7rem;padding:6px 12px;border-radius:6px;cursor:pointer;transition:all .2s}
.abtn:hover{border-color:var(--gold);color:var(--gold)}
.abtn-rand{border-color:var(--coral);color:var(--coral);font-weight:700}
.abtn-rand:hover{background:var(--coral);color:#000}

/* MAIN */
.main{padding:20px;max-width:1100px;margin:0 auto}
.cnt{font-size:.72rem;color:var(--gray);margin-bottom:14px;letter-spacing:.5px;text-transform:uppercase}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}

/* CARD */
.card{background:var(--bg2);border-radius:14px;overflow:hidden;border:1px solid var(--border);transition:transform .2s,box-shadow .2s,border-color .2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.6);border-color:var(--gray2)}
.card.watched{opacity:.6}
.card.watched:hover{opacity:.9}

/* POSTER */
.poster{position:relative;aspect-ratio:2/3;overflow:hidden;background:var(--bg3);cursor:pointer}
.poster img{width:100%;height:100%;object-fit:cover;display:none;transition:transform .3s;position:absolute;top:0;left:0}
.poster img.loaded{display:block}
.card:hover .poster img.loaded{transform:scale(1.04)}
.poster-ph{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;background:var(--bg3)}
.poster-yr{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--border);letter-spacing:2px}
.poster-ti{font-family:'Playfair Display',serif;font-size:.7rem;color:var(--gray2);line-height:1.3;font-style:italic}
.spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.wov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.card.watched .wov{opacity:1}
.wov span{font-size:2rem}

/* ACCENT */
.accent{height:3px}
.ac-drama{background:linear-gradient(90deg,#c77dff,#9d4edd)}
.ac-terror{background:linear-gradient(90deg,#ff6b6b,#cc2200)}
.ac-doc{background:linear-gradient(90deg,#4ecdc4,#2ab5ac)}
.ac-comedia{background:linear-gradient(90deg,#f5c518,#e6a817)}
.ac-sci{background:linear-gradient(90deg,#74c0fc,#4dabf7)}
.ac-accion{background:linear-gradient(90deg,#ff922b,#e8590c)}
.ac-romance{background:linear-gradient(90deg,#f783ac,#e64980)}
.ac-mudo{background:linear-gradient(90deg,#868e96,#495057)}
.ac-anime{background:linear-gradient(90deg,#63e6be,#20c997)}
.ac-default{background:linear-gradient(90deg,#333,#222)}

/* CARD BODY */
.cbody{padding:11px}
.ctitle{font-family:'Playfair Display',serif;font-size:.88rem;font-weight:700;line-height:1.3;margin-bottom:3px;color:var(--white)}
.cdir{font-size:.7rem;color:var(--gray);margin-bottom:7px;font-weight:300}
.ctags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.tag{font-size:.6rem;padding:2px 6px;border-radius:3px;letter-spacing:.3px;font-weight:600;text-transform:uppercase;white-space:nowrap}
.tag-yr{background:rgba(245,197,24,.12);color:var(--gold);border:1px solid rgba(245,197,24,.2)}
.tag-co{background:rgba(78,205,196,.1);color:var(--mint);border:1px solid rgba(78,205,196,.2)}
.tag-st{background:rgba(255,107,107,.1);color:var(--coral);border:1px solid rgba(255,107,107,.2)}

/* STARS */
.stars{display:flex;gap:2px;margin-bottom:7px}
.star{font-size:.95rem;color:var(--gray2);cursor:pointer;transition:color .15s;min-width:20px;min-height:22px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.star.on{color:var(--gold)}

/* CHECKBOX */
.crow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.cb{width:20px;height:20px;border-radius:5px;border:2px solid var(--gray2);background:transparent;cursor:pointer;appearance:none;-webkit-appearance:none;position:relative;transition:all .2s;flex-shrink:0;min-width:20px}
.cb:checked{background:var(--mint);border-color:var(--mint)}
.cb:checked::after{content:'';position:absolute;left:4px;top:1px;width:8px;height:11px;border:2px solid #000;border-top:none;border-left:none;transform:rotate(45deg)}
.clbl{font-size:.7rem;color:var(--gray);cursor:pointer}

/* NOTE */
.cnote{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:.75rem;padding:6px 8px;border-radius:6px;resize:none;min-height:34px;outline:none;transition:border-color .2s;line-height:1.4;margin-bottom:6px}
.cnote:focus{border-color:var(--gold)}
.cnote::placeholder{color:#333}

/* EXPAND BTNS */
.xbtn{width:100%;background:transparent;border:1px dashed var(--border);font-family:'Space Grotesk',sans-serif;font-size:.68rem;padding:5px 8px;border-radius:6px;cursor:pointer;transition:all .2s;margin-bottom:4px;text-align:left;display:flex;align-items:center;gap:5px}
.xbtn-syn{color:var(--mint)}.xbtn-syn:hover{border-color:var(--mint);background:rgba(78,205,196,.05)}
.xbtn-fac{color:var(--lav)}.xbtn-fac:hover{border-color:var(--lav);background:rgba(199,125,255,.05)}

/* EXPAND PANELS */
.xpanel{border-radius:6px;padding:9px;margin-bottom:4px;font-size:.75rem;line-height:1.6;display:none}
.xpanel.open{display:block}
.xpanel-syn{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.18)}
.xpanel-fac{background:rgba(199,125,255,.07);border:1px solid rgba(199,125,255,.18)}
.xlbl{font-size:.58rem;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.xlbl-syn{color:var(--mint)}.xlbl-fac{color:var(--lav)}
.xloading{color:var(--gray);font-style:italic}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--gray);grid-column:1/-1}
.empty-ico{font-size:2.5rem;margin-bottom:10px;display:block}

/* ALERT */
.ls-alert{background:#1a0808;border:1px solid var(--coral);color:var(--coral);padding:10px 20px;font-size:.82rem;display:none}

/* DISCOVER TAB */
.disc-wrap{padding:20px;max-width:900px;margin:0 auto}
.disc-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.disc-head h2{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold);font-style:italic}
.disc-fsel{background:var(--bg3);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:.8rem;padding:8px 10px;border-radius:8px;outline:none;cursor:pointer}
.disc-btn{background:var(--lav);color:#000;border:none;font-family:'Space Grotesk',sans-serif;font-size:.8rem;font-weight:700;padding:9px 18px;border-radius:8px;cursor:pointer;transition:opacity .2s}
.disc-btn:hover{opacity:.85}
.disc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.disc-card{background:var(--bg2);border-radius:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:transform .2s,box-shadow .2s}
.disc-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.5)}
.disc-poster{aspect-ratio:2/3;background:var(--bg3);position:relative;overflow:hidden}
.disc-poster img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0}
.disc-poster-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--border);position:absolute;top:0;left:0;background:var(--bg3)}
.disc-info{padding:10px}
.disc-title{font-family:'Playfair Display',serif;font-size:.85rem;font-weight:700;margin-bottom:3px;line-height:1.3}
.disc-meta{font-size:.68rem;color:var(--gray);margin-bottom:6px}
.disc-overview{font-size:.72rem;color:var(--gray);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.disc-add{width:100%;background:transparent;border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:.68rem;padding:5px;border-radius:5px;cursor:pointer;margin-top:4px;transition:all .2s}
.disc-add:hover{border-color:var(--lav);color:var(--lav)}
.disc-add.added{border-color:var(--mint);color:var(--mint)}
.disc-seen{width:100%;background:transparent;border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:.68rem;padding:5px;border-radius:5px;cursor:pointer;margin-top:4px;transition:all .2s}
.disc-seen:hover{border-color:var(--gold);color:var(--gold)}
.disc-seen.on{border-color:var(--gold);color:var(--gold);background:rgba(245,197,24,.08)}
.disc-card.disc-card-seen{opacity:.55}
.disc-card.disc-card-seen:hover{opacity:.85}
.disc-loading{text-align:center;padding:40px;color:var(--gray);grid-column:1/-1;font-style:italic}
.disc-genre-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.disc-gbtn{background:var(--bg3);border:1px solid var(--border);color:var(--gray);font-family:'Space Grotesk',sans-serif;font-size:.68rem;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .2s}
.disc-gbtn.on{background:var(--lav);color:#000;border-color:var(--lav);font-weight:700}

/* MODAL */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.moverlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:24px;max-width:520px;width:100%}
.modal h3{font-family:'Bebas Neue',sans-serif;letter-spacing:3px;font-size:1.3rem;color:var(--gold);margin-bottom:10px}
.modal textarea{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:.8rem;padding:10px;border-radius:8px;min-height:110px;outline:none;resize:vertical}
.mbtns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.mbtn-p{background:var(--gold);color:#000;border:none;font-family:'Space Grotesk',sans-serif;font-size:.83rem;font-weight:700;padding:9px 20px;border-radius:8px;cursor:pointer}
.mbtn-s{background:transparent;color:var(--gray);border:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-size:.83rem;padding:9px 20px;border-radius:8px;cursor:pointer}
.mbtn-s:hover{color:var(--white)}

/* RANDOM MODAL */
.rdisp{display:grid;grid-template-columns:110px 1fr;gap:14px;margin:14px 0;align-items:start}
.rposter{width:110px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--bg3);flex-shrink:0;position:relative}
.rposter img{width:100%;height:100%;object-fit:cover;display:none}
.rposter-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--border)}
.rtitle{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--white);margin-bottom:3px;font-weight:700;line-height:1.3}
.rdir{font-size:.75rem;color:var(--gray);margin-bottom:8px}
.rtags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.rcrow{display:flex;align-items:center;gap:7px;margin-top:6px}
.rbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.rbtn-roll{background:var(--bg3);color:var(--white);border:1px solid var(--border);font-family:'Space Grotesk',sans-serif;font-size:.8rem;padding:8px 16px;border-radius:8px;cursor:pointer}
.rbtn-roll:hover{border-color:var(--coral);color:var(--coral)}
.rrem{font-size:.65rem;color:var(--gray2);margin-top:8px;text-align:right}
.no-rand{color:var(--gray);text-align:center;padding:24px 0;font-size:.88rem;line-height:1.7}

@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeIn .25s ease both}

@media(max-width:580px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .main{padding:14px}.hdr{padding:10px 14px 8px}
  .filters,.actions{padding:8px 14px}
  .disc-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
}
</style>
</head>
<body>
<div class="ls-alert" id="ls-alert">⚠ localStorage no disponible. El progreso no se guardará.</div>

<div class="hdr">
  <div class="hdr-top">
    <div>
      <div class="logo"><span class="logo-dot"></span>CINETEQUE</div>
      <div class="logo-sub">tu checklist de cine mundial</div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tab-100" onclick="switchTab(100)">Top 100</button>
      <button class="tab" id="tab-500" onclick="switchTab(500)">Lista 500</button>
      <button class="tab discover-tab" id="tab-disc" onclick="switchTab('disc')">✦ Descubrir</button>
    </div>
  </div>
  <div class="prog">
    <div class="prog-row"><span id="prog-lbl">Cargando...</span><span id="prog-pct">0%</span></div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>

<div class="filters" id="filters-bar">
  <input class="search" id="srch" type="text" placeholder="Buscar título, director..." oninput="applyFilters()">
  <select class="fsel" id="f-country" onchange="applyFilters()"><option value="">Países</option></select>
  <select class="fsel" id="f-decade" onchange="applyFilters()"><option value="">Décadas</option></select>
  <select class="fsel" id="f-genre" onchange="applyFilters()"><option value="">Géneros</option></select>
  <select class="fsel" id="f-stream" onchange="applyFilters()"><option value="">Dónde ver</option></select>
  <div style="display:flex;gap:5px">
    <button class="fbtn on" id="fb-all" onclick="setSF('all')">Todas</button>
    <button class="fbtn" id="fb-seen" onclick="setSF('seen')">Vistas</button>
    <button class="fbtn" id="fb-unseen" onclick="setSF('unseen')">Por ver</button>
  </div>
</div>

<div class="actions">
  <button class="abtn abtn-rand" onclick="pickRandom()">🎲 Random</button>
  <button class="abtn" onclick="doExport()">↓ Exportar</button>
  <button class="abtn" onclick="openImport()">↑ Importar</button>
  <button class="abtn" onclick="doReset()">✕ Resetear</button>
  <span class="save-ind" id="save-ind">✓ guardado</span>
</div>

<div class="main" id="main-list">
  <div class="cnt" id="cnt-info"></div>
  <div class="grid" id="movie-grid"></div>
</div>

<div class="main disc-wrap" id="main-disc" style="display:none">
  <div class="disc-head">
    <div>
      <h2>✦ Descubrir</h2>
      <div style="font-size:.72rem;color:var(--gray);margin-top:3px">Películas recientes que podrían interesarte</div>
    </div>
    <select class="disc-fsel" id="disc-year">
      <option value="2026" selected>2026 — Estrenos</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
      <option value="2023">2023</option>
      <option value="2022">2022</option>
    </select>
    <button class="disc-btn" onclick="loadDiscover()">Buscar</button>
  </div>
  <div class="disc-genre-bar" id="disc-genres"></div>
  <div class="disc-grid" id="disc-grid"></div>
</div>

<div class="moverlay" id="rand-modal">
  <div class="modal" style="max-width:540px">
    <h3>Película Random</h3>
    <div style="font-size:.75rem;color:var(--gray);margin-bottom:4px">Solo no vistas · respeta filtros activos</div>
    <div id="rand-result"></div>
    <div class="mbtns"><button class="mbtn-s" onclick="closeRand()">Cerrar</button></div>
  </div>
</div>

<div class="moverlay" id="import-modal">
  <div class="modal">
    <h3>Importar Progreso</h3>
    <p style="font-size:.78rem;color:var(--gray);margin-bottom:10px">Pega el JSON exportado:</p>
    <textarea id="import-txt" placeholder='{"watched":{},"ratings":{},"notes":{}}'></textarea>
    <div class="mbtns">
      <button class="mbtn-s" onclick="closeImport()">Cancelar</button>
      <button class="mbtn-p" onclick="doImport()">Importar</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   CINETEQUE — arquitectura limpia
   Reglas: CERO backticks, CERO arrow functions
   ========================================================== */

var LS_KEY = 'cineteque_v2';
var lsOk = false;
var curTab = 100;
var sf = 'all';
var watched = {};
var ratings = {};
var notes = {};
var posterCache = {};
var synCache = {};
var randPool = [];
var discPage = 1;
var discGenre = '';
var discMovies = [];

var TMDB = '2dca580c2a14b55200e784d157207b4d';

/* ---- TEST localStorage ---- */
try {
  localStorage.setItem('__t', '1');
  localStorage.removeItem('__t');
  lsOk = true;
} catch(e) {
  document.getElementById('ls-alert').style.display = 'block';
}

/* ---- DATA ---- */
var top100 = [
  {id:'t1',title:'2001: A Space Odyssey',year:1968,dir:'Stanley Kubrick',country:'Reino Unido',genre:'Ciencia Ficción',stream:'Max'},
  {id:'t2',title:'La Passion de Jeanne d\'Arc',year:1928,dir:'Carl Theodor Dreyer',country:'Francia',genre:'Drama / Cine Mudo',stream:'YouTube'},

function countEntries(o) { return o ? Object.keys(o).length : 0; }

function stateSize() {
  return countEntries(watched) + countEntries(ratings) + countEntries(notes);
}

/* Devuelve cuántas entradas hay guardadas en una clave */
function storedSize(key) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) { return 0; }
    var d = JSON.parse(raw);
    return countEntries(d.watched) + countEntries(d.ratings) + countEntries(d.notes);
  } catch(e) { return 0; }
}

function saveAll() {
  if (!lsOk) { return; }
  /* GUARDA DE SEGURIDAD: nunca escribir antes de haber cargado */
  if (!dataLoaded) { return; }
  /* GUARDA DE SEGURIDAD: nunca sobrescribir datos con un estado vacío */
  if (stateSize() === 0 && storedSize(LS_KEY) > 0 && !allowEmptySave) {
    console.warn('saveAll bloqueado: evitaria borrar progreso existente');
    return;
  }
  try {
    var d = JSON.stringify({watched:watched, ratings:ratings, notes:notes});
    /* Copia de respaldo rodante del ultimo estado no vacio */
    if (stateSize() > 0) {
      try { localStorage.setItem(BK_KEY, d); } catch(e2) {}
    }
    localStorage.setItem(LS_KEY, d);
    var ind = document.getElementById('save-ind');
    if (ind) {
      ind.textContent = '✓ guardado';
      ind.style.opacity = '1';
      clearTimeout(ind._t);
      ind._t = setTimeout(function() { ind.style.opacity = '0'; }, 1800);
    }
  } catch(e) { console.error('save:', e); }
}

function loadAll() {
  if (!lsOk) { dataLoaded = true; return; }
  var usedKey = LS_KEY;
  try {
    var raw = localStorage.getItem(LS_KEY);
    /* Si la clave principal esta vacia pero hay respaldo, recuperar del respaldo */
    if ((!raw || storedSize(LS_KEY) === 0) && storedSize(BK_KEY) > 0) {
      raw = localStorage.getItem(BK_KEY);
      usedKey = BK_KEY;
    }
    if (!raw) { dataLoaded = true; return; }
    var d = JSON.parse(raw);
    if (d.watched) { watched = d.watched; }
    if (d.ratings) { ratings = d.ratings; }
    if (d.notes) { notes = d.notes; }
    if (usedKey === BK_KEY) { console.info('Progreso recuperado desde respaldo'); }
  } catch(e) { console.error('load:', e); }
  dataLoaded = true;
}

/* ============================================================
   UTILS
   ============================================================ */

function esc(s) {
  if (!s) { return ''; }
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escA(s) {
  if (!s) { return ''; }
  return s.replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
function accentClass(g) {
  var gl = g.toLowerCase();
  if (gl.indexOf('terror') !== -1 || gl.indexOf('horror') !== -1) { return 'ac-terror'; }
  if (gl.indexOf('mudo') !== -1) { return 'ac-mudo'; }
  if (gl.indexOf('documental') !== -1) { return 'ac-doc'; }
  if (gl.indexOf('comedia') !== -1) { return 'ac-comedia'; }
  if (gl.indexOf('ciencia') !== -1) { return 'ac-sci'; }
  if (gl.indexOf('acción') !== -1 || gl.indexOf('accion') !== -1) { return 'ac-accion'; }
  if (gl.indexOf('romance') !== -1) { return 'ac-romance'; }
  if (gl.indexOf('animación') !== -1 || gl.indexOf('anime') !== -1) { return 'ac-anime'; }
  if (gl.indexOf('drama') !== -1) { return 'ac-drama'; }
  return 'ac-default';
}
function decade(y) { return Math.floor(y / 10) * 10; }

/* ============================================================
   LIST DATA
   ============================================================ */

function getCurrent() {
  return curTab === 100 ? top100 : list500;
}

function findById(id) {
  var i;
  for (i = 0; i < top100.length; i++) { if (top100[i].id === id) { return top100[i]; } }
  for (i = 0; i < list500.length; i++) { if (list500[i].id === id) { return list500[i]; } }
  return null;
}

/* ============================================================
   PROGRESS
   ============================================================ */

function updateProgress() {
  var all = top100.concat(list500);
  var total = all.length;
  var seen = 0;
  var i, key;
  for (i = 0; i < all.length; i++) { if (watched[all[i].id] === true) { seen++; } }
  /* Count disc seen */
  var discSeen = 0;
  var keys = Object.keys(watched);
  for (i = 0; i < keys.length; i++) {
    key = keys[i];
    if (key.indexOf('disc-') === 0 && watched[key] === 'seen') { discSeen++; }
  }
  var cur = getCurrent();
  var curSeen = 0;
  for (i = 0; i < cur.length; i++) { if (watched[cur[i].id] === true) { curSeen++; } }
  var pct = total > 0 ? Math.round((seen / total) * 100) : 0;
  var discTxt = discSeen > 0 ? ' · ' + discSeen + ' descubiertas vistas' : '';
  if (curTab === 'disc') {
    document.getElementById('prog-lbl').textContent = discSeen + ' películas de Descubrir vistas' + (discSeen === 0 ? ' — empieza a explorar' : '');
  } else {
    document.getElementById('prog-lbl').textContent = curSeen + ' / ' + cur.length + ' en esta lista · ' + seen + ' / ' + total + ' total' + discTxt;
  }
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

function toggleWatched(id) {
  watched[id] = !watched[id];
  saveAll();
  updateProgress();
  var card = document.getElementById('card-' + id);

    if (watched[id]) { card.classList.add('watched'); } else { card.classList.remove('watched'); }

function setRating(id, val) {
  ratings[id] = val;
  saveAll();
  var s = document.getElementById('stars-' + id);
  if (s) { s.innerHTML = buildStars(id); }
}

function buildStars(id) {
  var r = ratings[id] || 0;
  var h = '';
  for (var i = 1; i <= 5; i++) {
    var cls = i <= r ? 'star on' : 'star';
    h += '<span class="' + cls + '" onclick="setRating(\'' + id + '\',' + i + ')">★</span>';
  }
  return h;
}

function saveNote(id, val) { notes[id] = val; saveAll(); }

/* ============================================================
   FILTERS
   ============================================================ */

function getF() {
  return {
    text: document.getElementById('srch').value.toLowerCase(),
    country: document.getElementById('f-country').value,
    decade: document.getElementById('f-decade').value,
    genre: document.getElementById('f-genre').value,
    stream: document.getElementById('f-stream').value,
    status: sf
  };
}

function setSF(val) {
  sf = val;
  var btns = ['all','seen','unseen'];
  for (var i = 0; i < btns.length; i++) {
    var b = document.getElementById('fb-' + btns[i]);
    if (b) {
      if (btns[i] === val) { b.classList.add('on'); } else { b.classList.remove('on'); }
    }
  }
  applyFilters();
}

function matches(m, f) {
  if (f.text) {
    var s = (m.title + ' ' + m.dir + ' ' + m.country + ' ' + m.genre).toLowerCase();
    if (s.indexOf(f.text) === -1) { return false; }
  }
  if (f.country && m.country.indexOf(f.country) === -1) { return false; }
  if (f.decade && decade(m.year) !== parseInt(f.decade)) { return false; }
  if (f.genre && m.genre.indexOf(f.genre) === -1) { return false; }
  if (f.stream && m.stream.indexOf(f.stream) === -1) { return false; }
  if (f.status === 'seen' && watched[m.id] !== true) { return false; }
  if (f.status === 'unseen' && watched[m.id] === true) { return false; }
  return true;
}

function applyFilters() {
  var f = getF();
  var list = getCurrent();
  var filtered = [];
  for (var i = 0; i < list.length; i++) {
    if (matches(list[i], f)) { filtered.push(list[i]); }
  }
  renderList(filtered);
  document.getElementById('cnt-info').textContent = filtered.length + ' de ' + list.length + ' películas';
}

function buildFilterSelects() {
  var list = getCurrent();
  var countries = {}, decades = {}, genres = {}, streams = {};
  var i, j, p, parts;
  for (i = 0; i < list.length; i++) {
    var m = list[i];
    parts = m.country.split(' / ');
    for (j = 0; j < parts.length; j++) { p = parts[j].trim(); if (p) { countries[p] = 1; } }
    decades[decade(m.year)] = 1;
    parts = m.genre.split(' / ');
    for (j = 0; j < parts.length; j++) { p = parts[j].trim(); if (p) { genres[p] = 1; } }
    if (m.stream) { streams[m.stream] = 1; }
  }
  var ch = '<option value="">Países</option>';
  var ca = Object.keys(countries).sort();
  for (i = 0; i < ca.length; i++) { ch += '<option value="' + esc(ca[i]) + '">' + esc(ca[i]) + '</option>'; }
  document.getElementById('f-country').innerHTML = ch;
  var dh = '<option value="">Décadas</option>';
  var da = Object.keys(decades).sort();
  for (i = 0; i < da.length; i++) { dh += '<option value="' + da[i] + '">' + da[i] + 's</option>'; }
  document.getElementById('f-decade').innerHTML = dh;
  var gh = '<option value="">Géneros</option>';
  var ga = Object.keys(genres).sort();
  for (i = 0; i < ga.length; i++) { gh += '<option value="' + esc(ga[i]) + '">' + esc(ga[i]) + '</option>'; }
  document.getElementById('f-genre').innerHTML = gh;
  var sh = '<option value="">Dónde ver</option>';
  var sa = Object.keys(streams).sort();
  for (i = 0; i < sa.length; i++) { sh += '<option value="' + esc(sa[i]) + '">' + esc(sa[i]) + '</option>'; }
  document.getElementById('f-stream').innerHTML = sh;
}

/* ============================================================
   POSTER LAZY LOADING
   ============================================================ */

var obsv = null;

function setupObs() {
  if (!window.IntersectionObserver) { return; }
  if (obsv) { obsv.disconnect(); }
  obsv = new IntersectionObserver(function(entries) {
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].isIntersecting) {
        var el = entries[i].target;
        var mid = el.getAttribute('data-mid');
        if (mid && !posterCache[mid]) {
          loadPoster(mid, el.getAttribute('data-title'), el.getAttribute('data-year'), mid);
        }
        obsv.unobserve(el);
      }
    }
  }, {rootMargin: '300px'});
}

function loadPoster(mid, title, year, domSuffix) {
  /* 1. Already cached */
  if (posterCache[mid] === 'none') { showPh(domSuffix, title, year); return; }
  if (posterCache[mid]) { showImg(domSuffix, posterCache[mid]); return; }
  /* 2. Pre-baked poster path — instant, no API call */
  if (POSTERS[mid]) {
    var pu = 'https://image.tmdb.org/t/p/w342' + POSTERS[mid];
    posterCache[mid] = pu;
    showImg(domSuffix, pu);
    return;
  }
  /* 3. Fallback: search by title (for list500 films) */
  var url = 'https://api.themoviedb.org/3/search/movie?api_key=' + TMDB + '&query=' + encodeURIComponent(title) + '&year=' + year + '&language=en-US';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var sp = document.getElementById('sp-' + domSuffix);
    if (sp) { sp.style.display = 'none'; }
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        if (d.results && d.results.length > 0 && d.results[0].poster_path) {
          var pu2 = 'https://image.tmdb.org/t/p/w342' + d.results[0].poster_path;
          posterCache[mid] = pu2;
          if (d.results[0].overview && !synCache[mid]) { synCache[mid] = d.results[0].overview; }
          showImg(domSuffix, pu2);
          return;
        }
      } catch(e) {}
    }
    posterCache[mid] = 'none';
    showPh(domSuffix, title, year);
  };
  xhr.send();
}

function loadPosterEn(mid, title, year, domSuffix) {
  var url = 'https://api.themoviedb.org/3/search/movie?api_key=' + TMDB + '&query=' + encodeURIComponent(title) + '&year=' + year + '&language=en-US';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        if (d.results && d.results.length > 0 && d.results[0].poster_path) {
          var pu = 'https://image.tmdb.org/t/p/w300' + d.results[0].poster_path;
          posterCache[mid] = pu;
          if (d.results[0].overview && !synCache[mid]) { synCache[mid] = '[en] ' + d.results[0].overview; }
          showImg(domSuffix, pu);
          return;
        }
      } catch(e) {}
    }
    posterCache[mid] = 'none';
    showPh(domSuffix, title, year);
  };
  xhr.send();
}

function showImg(sfx, url) {
  var img = document.getElementById('img-' + sfx);
  var ph = document.getElementById('ph-' + sfx);
  var sp = document.getElementById('sp-' + sfx);
  if (sp) { sp.style.display = 'none'; }
  if (!img) { return; }
  img.src = url;
  img.onload = function() {
    img.classList.add('loaded');
    if (ph) { ph.style.display = 'none'; }
  };
  img.onerror = function() {
    img.style.display = 'none';
    showPh(sfx, img.alt, '');
  };
}

function showPh(sfx, title, year) {
  var ph = document.getElementById('ph-' + sfx);
  var sp = document.getElementById('sp-' + sfx);
  if (sp) { sp.style.display = 'none'; }
  if (ph) {
    ph.style.display = 'flex';
    ph.innerHTML = '<div class="poster-yr">' + year + '</div><div class="poster-ti">' + esc(title) + '</div>';
  }
}

/* ============================================================
   SYNOPSIS
   ============================================================ */

function toggleSyn(id) {
  var panel = document.getElementById('syn-' + id);
  var btn = document.getElementById('sbtn-' + id);
  if (!panel) { return; }
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    if (btn) { btn.innerHTML = '◎ Sinopsis'; }
    return;
  }
  panel.classList.add('open');
  if (synCache[id]) {
    var lbl = synCache[id].indexOf('[en] ') === 0 ? 'sinopsis (en)' : 'sinopsis';
    var txt = synCache[id].replace('[en] ', '');
    panel.innerHTML = '<div class="xlbl xlbl-syn">' + lbl + '</div>' + esc(txt);
    if (btn) { btn.innerHTML = '◎ Ocultar'; }
    return;
  }
  panel.innerHTML = '<div class="xlbl xlbl-syn">sinopsis</div><span class="xloading">Cargando...</span>';
  if (btn) { btn.innerHTML = '◎ Cargando...'; }
  var m = findById(id);
  if (!m) { panel.innerHTML = '<div class="xlbl xlbl-syn">sinopsis</div>No disponible.'; return; }
  fetchSyn(id, m.title, m.year, panel, btn, false);
}

function fetchSyn(id, title, year, panel, btn, isEn) {
  var lang = isEn ? 'en-US' : 'es-ES';
  var url = 'https://api.themoviedb.org/3/search/movie?api_key=' + TMDB + '&query=' + encodeURIComponent(title) + '&year=' + year + '&language=' + lang;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var p = document.getElementById('syn-' + id);
    var b = document.getElementById('sbtn-' + id);
    if (!p) { return; }
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        if (d.results && d.results.length > 0 && d.results[0].overview) {
          var ov = d.results[0].overview;
          var prefix = isEn ? '[en] ' : '';
          synCache[id] = prefix + ov;
          var lbl = isEn ? 'sinopsis (en)' : 'sinopsis';
          p.innerHTML = '<div class="xlbl xlbl-syn">' + lbl + '</div>' + esc(ov);
          if (b) { b.innerHTML = '◎ Ocultar'; }
          return;
        }
      } catch(e) {}
    }
    if (!isEn) {
      fetchSyn(id, title, year, p, b, true);
    } else {
      p.innerHTML = '<div class="xlbl xlbl-syn">sinopsis</div>No disponible.';
      if (b) { b.innerHTML = '◎ Sinopsis'; }
    }
  };
  xhr.send();
}

/* ============================================================
   CURIOUS FACTS
   ============================================================ */

function toggleFact(id, title, year, dir) {
  var panel = document.getElementById('fac-' + id);
  var btn = document.getElementById('fbtn-' + id);
  if (!panel) { return; }
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    if (btn) { btn.innerHTML = '✦ Dato curioso'; }
    return;
  }
  panel.classList.add('open');
  if (panel.getAttribute('data-loaded') === '1') {
    if (btn) { btn.innerHTML = '✦ Ocultar'; }
    return;
  }
  if (FACTS[id]) {
    panel.innerHTML = '<div class="xlbl xlbl-fac">✦ dato curioso</div>' + esc(FACTS[id]);
    panel.setAttribute('data-loaded', '1');
    if (btn) { btn.innerHTML = '✦ Ocultar'; }
    return;
  }
  panel.innerHTML = '<div class="xlbl xlbl-fac">✦ dato curioso</div><span class="xloading">Cargando...</span>';
  if (btn) { btn.innerHTML = '✦ Cargando...'; }
  fetchFact(id, title, year, dir, panel, btn);
}

function fetchFact(id, title, year, dir, panel, btn) {
  var prompt = 'Dame UN dato curioso, inesperado o poco conocido sobre la pelicula "' + title + '" (' + year + ') de ' + dir + '. Maximo 2 oraciones. Sin introduccion.';
  var body = JSON.stringify({
    model: 'claude-haiku-4-5-20251001',
    max_tokens: 200,
    messages: [{role: 'user', content: prompt}]
  });
  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://api.anthropic.com/v1/messages', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var p = document.getElementById('fac-' + id);
    var b = document.getElementById('fbtn-' + id);
    if (!p) { return; }
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        var text = '';
        if (d.content && d.content.length > 0) {
          for (var i = 0; i < d.content.length; i++) {
            if (d.content[i].type === 'text') { text = d.content[i].text; break; }
          }
        }
        if (text) {
          p.innerHTML = '<div class="xlbl xlbl-fac">✦ dato curioso</div>' + esc(text);
          p.setAttribute('data-loaded', '1');
          if (b) { b.innerHTML = '✦ Ocultar'; }
          return;
        }
      } catch(e) {}
    }
    p.innerHTML = '<div class="xlbl xlbl-fac">✦ dato curioso</div>No disponible (funciona mejor desde GitHub Pages).';
    p.setAttribute('data-loaded', '1');
    if (b) { b.innerHTML = '✦ Dato curioso'; }
  };
  xhr.send(body);
}

/* ============================================================
   RENDER LIST
   ============================================================ */

function renderList(movies) {
  setupObs();
  var container = document.getElementById('movie-grid');
  var html = '';
  var i, m, isW, note, ac, cbC, cC;
  for (i = 0; i < movies.length; i++) {
    m = movies[i];
    isW = watched[m.id] === true;
    note = notes[m.id] || '';
    ac = accentClass(m.genre);
    cbC = isW ? 'checked' : '';
    cC = isW ? 'card watched' : 'card';
    html += '<div class="' + cC + '" id="card-' + m.id + '">';
    /* POSTER */
    html += '<div class="poster" data-mid="' + m.id + '" data-title="' + escA(m.title) + '" data-year="' + m.year + '" onclick="toggleSyn(\'' + m.id + '\')">';
    html += '<div class="spin" id="sp-' + m.id + '"></div>';
    html += '<img id="img-' + m.id + '" alt="' + escA(m.title) + '" onerror="posterErr(\'' + m.id + '\',\'' + escA(m.title) + '\',' + m.year + ')">';
    html += '<div id="ph-' + m.id + '" class="poster-ph" style="display:none"></div>';
    html += '<div class="wov"><span>✓</span></div>';
    html += '</div>';
    /* ACCENT */
    html += '<div class="accent ' + ac + '"></div>';
    /* BODY */
    html += '<div class="cbody">';
    html += '<div class="ctitle">' + esc(m.title) + '</div>';
    html += '<div class="cdir">' + esc(m.dir) + '</div>';
    html += '<div class="ctags">';
    html += '<span class="tag tag-yr">' + m.year + '</span>';
    html += '<span class="tag tag-co">' + esc(m.country) + '</span>';
    if (m.stream) { html += '<span class="tag tag-st">' + esc(m.stream) + '</span>'; }
    html += '</div>';
    html += '<div class="stars" id="stars-' + m.id + '">' + buildStars(m.id) + '</div>';
    html += '<div class="crow">';
    html += '<input type="checkbox" class="cb" id="cb-' + m.id + '" ' + cbC + ' onchange="toggleWatched(\'' + m.id + '\')">';
    html += '<label class="clbl" for="cb-' + m.id + '">Vista</label>';
    html += '</div>';
    html += '<textarea class="cnote" placeholder="Notas..." onchange="saveNote(\'' + m.id + '\',this.value)">' + esc(note) + '</textarea>';
    html += '<button class="xbtn xbtn-syn" id="sbtn-' + m.id + '" onclick="toggleSyn(\'' + m.id + '\')">◎ Sinopsis</button>';
    html += '<div class="xpanel xpanel-syn" id="syn-' + m.id + '"></div>';
    html += '<button class="xbtn xbtn-fac" id="fbtn-' + m.id + '" onclick="toggleFact(\'' + m.id + '\',\'' + escA(m.title) + '\',' + m.year + ',\'' + escA(m.dir) + '\')">✦ Dato curioso</button>';
    html += '<div class="xpanel xpanel-fac" id="fac-' + m.id + '"></div>';
    html += '</div></div>';
  }
  if (movies.length === 0) {
    html = '<div class="empty"><span class="empty-ico">🎬</span><p>Sin resultados con estos filtros.</p></div>';
  }
  container.innerHTML = html;
  if (obsv) {
    var wraps = container.querySelectorAll('.poster[data-mid]');
    for (var j = 0; j < wraps.length; j++) { obsv.observe(wraps[j]); }
  }
}

function posterErr(id, title, year) {
  posterCache[id] = 'none';
  var img = document.getElementById('img-' + id);
  if (img) { img.style.display = 'none'; }
  showPh(id, title, year);
}

function loadDiscover() {
  var yr = document.getElementById('disc-year').value;
  var grid = document.getElementById('disc-grid');
  var label = yr === '2026' ? 'estrenos de 2026' : 'películas de ' + yr;
  grid.innerHTML = '<div class="disc-loading">Buscando ' + label + '...</div>';
  buildDiscGenres();

  /* For 2026: use upcoming endpoint (low vote threshold) + discover with primary_release_year
     For older: discover with higher vote threshold
     Use multiple pages merged to get decent results */
  var minVotes = yr === '2026' ? 3 : (yr === '2025' ? 10 : 50);
  var sortBy = yr === '2026' ? 'popularity.desc' : 'vote_average.desc';

  /* Primary URL */
  var url = 'https://api.themoviedb.org/3/discover/movie?api_key=' + TMDB
    + '&primary_release_year=' + yr
    + '&sort_by=' + sortBy
    + '&vote_count.gte=' + minVotes
    + '&language=es-ES'
    + '&region=US'
    + '&page=1';
  if (discGenre) { url += '&with_genres=' + discGenre; }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        discMovies = d.results || [];
        /* For 2026 also fetch page 2 to get more results */
        if (yr === '2026' && d.total_pages > 1) {
          fetchDiscPage2(url.replace('page=1','page=2'), discMovies);
        } else {
          renderDiscover(discMovies);
        }
        return;
      } catch(e) {}
    }
    /* CORS blocked (file://) — show helpful message with curated 2026 list */
    showDiscCorsMsg(yr);
  };
  xhr.onerror = function() { showDiscCorsMsg(yr); };
  xhr.send();
}

function fetchDiscPage2(url, existing) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var combined = existing.slice();
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        var extra = d.results || [];
        for (var i = 0; i < extra.length; i++) { combined.push(extra[i]); }
      } catch(e) {}
    }
    renderDiscover(combined);
  };
  xhr.onerror = function() { renderDiscover(existing); };
  xhr.send();
}

function renderDiscover(movies) {
  var grid = document.getElementById('disc-grid');
  if (!movies || movies.length === 0) {
    grid.innerHTML = '<div class="disc-loading">Sin resultados para este año/género.<br><small>Prueba quitando el filtro de género.</small></div>';
    return;
  }
  /* Sort: curated first by order, then by vote_average desc */
  var curated = [], regular = [];
  for (var k = 0; k < movies.length; k++) {
    if (movies[k].curated) { curated.push(movies[k]); } else { regular.push(movies[k]); }
  }
  regular.sort(function(a,b) { return (b.vote_average||0) - (a.vote_average||0); });
  var sorted = curated.concat(regular);

  var html = '';
  var i, m, ov, posterUrl, yr, score;
  for (i = 0; i < sorted.length && i < 48; i++) {
    m = sorted[i];
    ov = m.overview ? (m.overview.length > 130 ? m.overview.substring(0, 128) + '…' : m.overview) : 'Sin sinopsis disponible.';
    posterUrl = m.poster_path ? 'https://image.tmdb.org/t/p/w342' + m.poster_path : '';
    yr = m.release_date && m.release_date.length >= 4 ? m.release_date.substring(0,4) : '2026';
    score = m.vote_average && m.vote_average > 0 ? '★ ' + m.vote_average.toFixed(1) : (m.curated ? '✦ curada' : 'nueva');
    var mid2 = m.id;
    var keyDisc = 'disc-' + mid2;
    var isPending = watched[keyDisc] === 'pending';
    var isSeen = watched[keyDisc] === 'seen';
    var cardCls = isSeen ? 'disc-card disc-card-seen' : 'disc-card';
    var addTxt = isPending ? '✓ Pendiente — quitar' : '+ Pendiente';
    var addCls = isPending ? 'disc-add added' : 'disc-add';
    var seenTxt = isSeen ? '★ Vista — desmarcar' : '◎ Ya la vi';
    var seenCls = isSeen ? 'disc-seen on' : 'disc-seen';
    html += '<div class="' + cardCls + '" id="dcard-' + mid2 + '">';
    html += '<div class="disc-poster">';
    if (posterUrl) {
      html += '<img src="' + posterUrl + '" onerror="this.style.display=\'none\';document.getElementById(\'dph-' + mid2 + '\').style.display=\'flex\'">';
    }
    html += '<div class="disc-poster-ph" id="dph-' + mid2 + '" style="display:' + (posterUrl ? 'none' : 'flex') + '">' + yr + '</div>';
    html += '</div>';
    html += '<div class="disc-info">';
    html += '<div class="disc-title">' + esc(m.title || m.original_title || '') + '</div>';
    html += '<div class="disc-meta">' + yr + ' · ' + score + '</div>';
    html += '<div class="disc-overview" id="dovw-' + mid2 + '">' + esc(ov) + '</div>';
    html += '<button class="xbtn xbtn-syn" id="dsbtn-' + mid2 + '" style="margin-top:6px" data-action="disc-syn" data-id="' + mid2 + '" data-title="' + escA(m.title || m.original_title || '') + '" data-year="' + yr + '">◎ Sinopsis completa</button>';
    html += '<div class="xpanel xpanel-syn" id="dsyn-' + mid2 + '"></div>';
    html += '<button class="' + addCls + '" id="dadd-' + mid2 + '" data-action="disc-pending" data-id="' + mid2 + '" data-title="' + escA(m.title || m.original_title || '') + '">' + addTxt + '</button>';
    html += '<button class="' + seenCls + '" id="dseen-' + mid2 + '" data-action="disc-seen" data-id="' + mid2 + '" data-title="' + escA(m.title || m.original_title || '') + '">' + seenTxt + '</button>';
    html += '</div></div>';
  }
  grid.innerHTML = html;
  /* Attach delegated listener fresh each render */
  var g = document.getElementById('disc-grid');
  if (g._discListener) { g.removeEventListener('click', g._discListener); }
  g._discListener = function(e) {
    var btn = e.target;
    if (!btn || !btn.getAttribute) { return; }
    var action = btn.getAttribute('data-action');
    if (!action) { return; }
    var id = parseInt(btn.getAttribute('data-id'), 10);
    var title = btn.getAttribute('data-title') || '';
    if (action === 'disc-pending') { toggleDiscPending(id, title); }
    else if (action === 'disc-seen') { toggleDiscSeen(id, title); }
    else if (action === 'disc-syn') {
      var yr2 = btn.getAttribute('data-year') || '2026';
      toggleDiscSyn(id, title, yr2);
    }
  };
  g.addEventListener('click', g._discListener);
}

function toggleDiscPending(tmdbId, title) {
  var key = 'disc-' + tmdbId;
  var cur = watched[key];
  if (cur === 'pending') {
    delete watched[key];
  } else {
    watched[key] = 'pending';
    if (!notes[key]) { notes[key] = title; }
  }
  saveAll();
  refreshDiscCard(tmdbId);
}

function toggleDiscSeen(tmdbId, title) {
  var key = 'disc-' + tmdbId;
  var cur = watched[key];
  if (cur === 'seen') {
    delete watched[key];
  } else {
    watched[key] = 'seen';
    if (!notes[key]) { notes[key] = title; }
  }
  saveAll();
  refreshDiscCard(tmdbId);
}

function refreshDiscCard(tmdbId) {
  var key = 'disc-' + tmdbId;
  var cur = watched[key];
  var isPending = cur === 'pending';
  var isSeen = cur === 'seen';
  var card = document.getElementById('dcard-' + tmdbId);
  var addBtn = document.getElementById('dadd-' + tmdbId);
  var seenBtn = document.getElementById('dseen-' + tmdbId);
  if (card) {
    if (isSeen) { card.classList.add('disc-card-seen'); } else { card.classList.remove('disc-card-seen'); }
  }
  if (addBtn) {
    addBtn.textContent = isPending ? '✓ Pendiente — quitar' : '+ Pendiente';
    if (isPending) { addBtn.classList.add('added'); } else { addBtn.classList.remove('added'); }
  }
  if (seenBtn) {
    seenBtn.textContent = isSeen ? '★ Vista — desmarcar' : '◎ Ya la vi';
    if (isSeen) { seenBtn.classList.add('on'); } else { seenBtn.classList.remove('on'); }
  }
  updateProgress();
}

function toggleDiscSyn(tmdbId, title, year) {
  var panel = document.getElementById('dsyn-' + tmdbId);
  var btn = document.getElementById('dsbtn-' + tmdbId);
  if (!panel) { return; }
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    if (btn) { btn.innerHTML = '◎ Sinopsis completa'; }
    return;
  }
  panel.classList.add('open');
  if (panel.getAttribute('data-loaded') === '1') {
    if (btn) { btn.innerHTML = '◎ Ocultar'; }
    return;
  }
  panel.innerHTML = '<span class="xloading">Cargando...</span>';
  if (btn) { btn.innerHTML = '◎ Cargando...'; }
  var url = 'https://api.themoviedb.org/3/search/movie?api_key=' + TMDB + '&query=' + encodeURIComponent(title) + '&year=' + year + '&language=es-ES';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) { return; }
    var p = document.getElementById('dsyn-' + tmdbId);
    var b = document.getElementById('dsbtn-' + tmdbId);
    if (!p) { return; }
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        if (d.results && d.results.length > 0 && d.results[0].overview) {
          p.innerHTML = '<div class="xlbl xlbl-syn">sinopsis</div>' + esc(d.results[0].overview);
          p.setAttribute('data-loaded', '1');
          if (b) { b.innerHTML = '◎ Ocultar'; }
          return;
        }
      } catch(e) {}
    }
    /* fallback English */
    var url2 = 'https://api.themoviedb.org/3/search/movie?api_key=' + TMDB + '&query=' + encodeURIComponent(title) + '&year=' + year + '&language=en-US';
    var xhr2 = new XMLHttpRequest();
    xhr2.open('GET', url2, true);
    xhr2.onreadystatechange = function() {
      if (xhr2.readyState !== 4) { return; }
      var p2 = document.getElementById('dsyn-' + tmdbId);
      var b2 = document.getElementById('dsbtn-' + tmdbId);
      if (!p2) { return; }
      if (xhr2.status === 200) {
        try {
          var d2 = JSON.parse(xhr2.responseText);
          if (d2.results && d2.results.length > 0 && d2.results[0].overview) {
            p2.innerHTML = '<div class="xlbl xlbl-syn">sinopsis (en)</div>' + esc(d2.results[0].overview);
            p2.setAttribute('data-loaded', '1');
            if (b2) { b2.innerHTML = '◎ Ocultar'; }
            return;
          }
        } catch(e) {}
      }
      p2.innerHTML = '<div class="xlbl xlbl-syn">sinopsis</div>No disponible.';
      p2.setAttribute('data-loaded', '1');
      if (b2) { b2.innerHTML = '◎ Sinopsis completa'; }
    };
    xhr2.send();
  };
  xhr.send();
}

function getUnwatched() {
  var f = getF();
  var list = getCurrent();
  var pool = [];
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    if (watched[m.id] === true) { continue; }
    if (f.text) {
      var s = (m.title + ' ' + m.dir + ' ' + m.country + ' ' + m.genre).toLowerCase();
      if (s.indexOf(f.text) === -1) { continue; }
    }
    if (f.country && m.country.indexOf(f.country) === -1) { continue; }
    if (f.decade && decade(m.year) !== parseInt(f.decade)) { continue; }
    if (f.genre && m.genre.indexOf(f.genre) === -1) { continue; }
    pool.push(m);
  }
  return pool;
}

function loadRandSyn(mid, title, year) {
  var panel = document.getElementById('rsyn-' + mid);
  if (!panel) { return; }
  if (synCache[mid]) {
    var lbl = synCache[mid].indexOf('[en] ') === 0 ? 'sinopsis (en)' : 'sinopsis';
    var txt = synCache[mid].replace('[en] ','');
    panel.innerHTML = '<div class="xlbl xlbl-syn">' + lbl + '</div>' + esc(txt);
    return;
  }
  fetchSyn(mid, title, year, panel, null, false);
}

function loadRandFact(mid, title, year, dir) {
  var panel = document.getElementById('rfac-' + mid);
  if (!panel) { return; }
  if (FACTS[mid]) {
    panel.innerHTML = '<div class="xlbl xlbl-fac">✦ dato curioso</div>' + esc(FACTS[mid]);
    return;
  }
  fetchFact(mid, title, year, dir, panel, null);
}

function toggleRandW(id) {
  toggleWatched(id);
  var s = document.getElementById('rstars-' + id);
  if (s) { s.innerHTML = buildStars(id); }
}

function closeRand() {
  document.getElementById('rand-modal').classList.remove('open');
  randPool = [];
}

/* ============================================================
   EXPORT / IMPORT / RESET
   ============================================================ */

function doExport() {
  var d = JSON.stringify({watched:watched, ratings:ratings, notes:notes}, null, 2);
  var b = new Blob([d], {type:'application/json'});
  var u = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = u; a.download = 'cineteque-progreso.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(u);
}

function openImport() { document.getElementById('import-modal').classList.add('open'); }
function closeImport() {
  document.getElementById('import-modal').classList.remove('open');
  document.getElementById('import-txt').value = '';
}

function doImport() {
  var txt = document.getElementById('import-txt').value.trim();
  if (!txt) { alert('Pega el JSON primero.'); return; }
  try {
    var d = JSON.parse(txt);
    if (d.watched) { watched = d.watched; }
    if (d.ratings) { ratings = d.ratings; }
    if (d.notes) { notes = d.notes; }
    saveAll(); closeImport(); applyFilters(); updateProgress();
    alert('Progreso importado.');
  } catch(e) { alert('JSON inválido.'); }
}

function doReset() {
  if (!confirm('¿Borrar todo el progreso?')) { return; }
  watched = {}; ratings = {}; notes = {};
  allowEmptySave = true;
  try { localStorage.removeItem(BK_KEY); } catch(e) {}
  saveAll();
  allowEmptySave = false;
  applyFilters(); updateProgress();
}

/* ============================================================
   INIT
   ============================================================ */

loadAll();
buildFilterSelects();
applyFilters();
updateProgress();

/* Guardado en cada accion. No se guarda a ciegas al cerrar:
   eso podia sobrescribir el progreso con un estado vacio. */

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeRand(); closeImport(); }
});
document.getElementById('rand-modal').addEventListener('click', function(e) {
  if (e.target === this) { closeRand(); }
});
document.getElementById('import-modal').addEventListener('click', function(e) {
  if (e.target === this) { closeImport(); }
});

</script>
